[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permea-core"
version = "0.1.0"
description = "PermeaBench: honest-evaluation engine, warning registry, and diagnose CLI."
requires-python = ">=3.11"
license = "Apache-2.0"
# NOTE (permea-eval/1.0 W403 EnvironmentUnpinned): this is the TOOL's permissive dependency
# floor, deliberately loose so the CLI installs broadly. It is NOT the paper's pinned
# reproduction environment -- exact numeric reproduction of published results depends on a
# fully pinned python/numpy/scikit-learn/architecture stack recorded separately. Do not
# conflate the two.
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # Web UI (permea_ui / the `permea-drylab` server) stack. Shipped in base -- not gated
    # behind an extra -- so plain `pip install permea-core` (no extras) is enough to run the
    # UI. python-multipart is what lets FastAPI accept the dataset/cluster uploads. The
    # engine still imports none of these at diagnose time (held by
    # tests/test_ui_drylab.py::test_importing_the_engine_does_not_pull_the_web_stack).
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Opt-in narration layer (permea_explain). This extra gates ONLY the transport
# dependencies used by the live model path; permea_explain itself always ships. Without the
# extra the package still imports, but a live provider call surfaces a clean install hint.
explain = [
    "openai>=1.0",
    "requests>=2.28",
    # The EXTRACT postcondition's schema gate. Validating against extract.schema.json rather
    # than re-stating its constraints in Python is what keeps the gate from forking away from
    # the schema it enforces.
    "jsonschema>=4.18",
]

# Drylab web UI (permea_ui). The web deps (fastapi, uvicorn, python-multipart) now live in
# base `dependencies`, so `pip install permea-core` runs the UI with no extra. This key is
# kept as an empty alias for backward compatibility: `pip install permea-core[ui]` still
# resolves, and the dev extra's `permea-core[explain,ui]` reference stays valid.
ui = []

# The full develop-and-test bundle: `pip install .[dev]` is the single command CI runs to
# get an environment that can execute the ENTIRE suite. Nothing here is needed to *use* the
# CLI.
dev = [
    # Self-referential: pull the feature extras, because the test suite imports their deps
    # unconditionally (tests/test_ui_drylab.py imports fastapi; several test_explain_*.py
    # import jsonschema). Without these, pytest fails at COLLECTION, not as skips.
    "permea-core[explain,ui]",
    # Release + test tooling. `build`/`twine` are what a release runs (no upload in-repo);
    # `pytest` runs the suite, including the packaging smoke test that shells out to
    # `python -m build`.
    "build>=1.0",
    "twine>=5.0",
    "pytest>=8.0",
    # PyYAML is an OPTIONAL runtime dep of permea_core: the registry/manifest/card loaders
    # guard `import yaml` and raise a clear error when it is absent, so it is deliberately
    # NOT in base `dependencies` (the diagnose CLI never needs it). The suite exercises those
    # YAML paths, so it must be present to develop/test -- hence here.
    "pyyaml>=6.0",
]

[project.scripts]
permea = "permea_core.cli.main:main"
permea-drylab = "permea_ui.__main__:main"

[tool.setuptools.packages.find]
# Three top-level packages: permea_core (src layout), plus permea_explain and permea_ui
# (repo root, both opt-in). The include filter keeps discovery to exactly these trees.
where = ["src", "."]
include = ["permea_core*", "permea_explain*", "permea_ui*"]

[tool.setuptools.package-data]
# The EXTRACT gates read their enums from these two schemas at runtime and refuse to fall back
# to hand-copied values, so a wheel that omits them is a wheel where extract() cannot run at
# all. Not decoration -- load-bearing at import-adjacent runtime.
permea_explain = ["schemas/*.schema.json"]
# The UI serves these from disk at request time; a wheel without them installs a server
# that returns 404 for its own front end.
permea_ui = ["static/*"]

[tool.pytest.ini_options]
# Registered so the packaging smoke test's markers are not "unknown". `packaging` (also
# tagged `slow`) builds a wheel, spins up a throwaway venv, and drives the installed console
# script -- deselect it in fast runs with:  pytest -m "not packaging"
markers = [
    "slow: test is slow (builds/install/subprocess); safe to skip in fast local runs",
    "packaging: exercises a real wheel build + clean-venv install (implies slow)",
]
